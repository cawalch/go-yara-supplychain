name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Formatting
        run: |
          diff=$(gofmt -s -d .)
          if [ -n "$diff" ]; then
            echo "The following files need gofmt:"
            echo "$diff"
            exit 1
          fi

      - name: Run Tests with Race Detector
        run: go test -race -v ./...

      - name: Build Binary
        run: go build -v ./cmd/go-yara-supplychain

      - name: Run Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
